{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход в админ-панель</title>
  <link rel="stylesheet" href="{% static 'styles/css/unified_portal.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-card__intro">
        <span class="auth-badge">Панель администратора</span>
        <h1>Вход администратора</h1>
        <p>Введите email и пароль администратора, чтобы открыть панель управления.</p>
      </div>

      <form class="auth-form" method="post">
        {% csrf_token %}

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" required placeholder="admin@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" name="password" required placeholder="Введите пароль" autocomplete="current-password" />
        </div>

        {% if error %}
          <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <button type="submit">Войти</button>
      </form>

      <div class="auth-footer">
        <span>Для обычного пользователя доступен отдельный вход.</span>
        <a href="/support/login/">Вход в поддержку</a>
      </div>
    </section>
  </main>
</body>
</html>
